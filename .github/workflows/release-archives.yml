name: Release archives

# Publishes self-contained lobby builds (EvoS.Sandbox executable + Config) for
# windows-x64 and linux-x64, plus the evos.admin static site, as zip archives
# attached to a GitHub Release. Runs on version tags; also runnable manually
# (workflow_dispatch) which builds+uploads artifacts but does not create a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  lobby:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows
          - rid: linux-x64
            os: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Not trimmed: EvosSerializer reflects over the assemblies at startup, so
      # trimming would strip message types. Config files are copied to the publish
      # output via CopyToOutputDirectory, so they land in ./publish automatically.
      - name: Publish lobby (${{ matrix.rid }})
        run: >
          dotnet publish EvoS.Sandbox/EvoS.Sandbox.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish

      - name: Package
        run: |
          mv publish evos-${{ matrix.os }}-x64
          zip -r evos-${{ matrix.os }}-x64.zip evos-${{ matrix.os }}-x64

      - uses: actions/upload-artifact@v4
        with:
          name: evos-${{ matrix.os }}-x64
          path: evos-${{ matrix.os }}-x64.zip

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evos.admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: evos.admin/package-lock.json

      - run: npm ci

      # CI=false: CRA treats lint warnings as errors when CI is set (as it is on
      # GitHub Actions), which would fail the build on harmless warnings.
      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Package
        run: |
          mv build evos-admin
          zip -r ../evos-admin.zip evos-admin

      - uses: actions/upload-artifact@v4
        with:
          name: evos-admin
          path: evos-admin.zip

  release:
    # Attach the archives to the GitHub Release for the pushed tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lobby, admin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip